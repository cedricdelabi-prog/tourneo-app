  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    name: Types et tests TV
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branche V2
        uses: actions/checkout@v4
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier le typage
        run: npx tsc --noEmit
      - name: Tester le moteur et la restauration des sauvegardes
        run: npm test
      - name: Vérifier la procédure de sauvegarde gratuite V1
        run: node tests/sauvegarde-cli-v1.cjs
      - name: Verifier la nouvelle sauvegarde IPv4 sans acces production
        run: node tests/sauvegarde-ipv4-v1.cjs
      - name: Auditer une archive IPv4 synthetique hors connexion
        run: node tests/auditer-archive-ipv4-v1.cjs
      - name: Vérifier la purge et le ciblage du bon projet Supabase
        run: npm run test:purge
      - name: Tester le vrai script de sauvegarde avec une fausse CLI PowerShell
        shell: pwsh
        run: ./tests/sauvegarde-cli-v1.ps1
      - name: Tester la copie privee des medias avec une fausse CLI PowerShell
        shell: pwsh
        run: ./tests/sauvegarde-media-v1.ps1
      - name: Vérifier le compteur public des inscrits Tourneo
        run: node tests/compteur-communaute.cjs
      - name: Vérifier les scores hérités de la V1
        run: node tests/compatibilite-v1.cjs
      - name: Contrôler les conflits entre appareils
        run: node tests/versions-conflit.cjs
      - name: Vérifier l'écran TV
        run: npm run test:tv
      - name: Vérifier les scénarios d'imprévus
        run: npm run test:imprevus
      - name: Vérifier le cockpit organisateur
        run: npm run test:cockpit
      - name: Tester le prévol de migration V1 → V2 sans données réelles
        run: npm run test:bascule
      - name: Tester la fin de migration V1 vers V2 (phases 18 a 20 fictives)
        run: node tests/migration-finales-v2.cjs
      - name: Tester les anciens liens et les RPC publics sur une base fictive
        run: node tests/partage-compatibilite.cjs
      - name: Vérifier les retours de connexion sécurisés
        run: node tests/pronostics.cjs
      - name: Compiler la V2 hors publication
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kmjfmjhdnokkaiolxiin.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-non-production-key-not-connected
          NEXT_PUBLIC_TOURNEO_V2_PRODUCTION_APPROVED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Vérifier la syntaxe des tests navigateur
        run: node --check tests/experience-browser.cjs && node --check tests/tv-multi-appareils-browser.cjs
      - name: Installer Chromium pour le parcours TV simulé
        run: npx playwright install chromium
      - name: Tester la télécommande et la TV dans deux navigateurs isolés
        run: node tests/tv-multi-appareils-browser.cjs
      - name: Tester les scénarios d'imprévus en navigateur mobile
        env:
          TEST_WIDTHS: '390'
          TEST_INCIDENT_ONLY: '1'
        run: node tests/experience-browser.cjs
