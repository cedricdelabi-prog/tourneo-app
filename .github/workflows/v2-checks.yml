name: Tourneo V2 - contrôles sans déploiement
on:
  push:
    branches:
      - release-v2-preparation-2026-11-19
    paths:
      - 'components/EcranTV.tsx'
      - 'components/ImprevusTournoi.tsx'
      - 'lib/imprevus-tournoi.ts'
      - 'lib/planning.ts'
      - 'tests/imprevus-tournoi.cjs'
      - 'tests/experience-browser.cjs'
      - 'lib/ecran-tv.ts'
      - 'lib/modeles-affiche.ts'
      - 'components/IdentiteVisuelleTournoi.tsx'
      - 'app/tournoi/[id]/page.tsx'
      - 'tests/ecran-tv.cjs'
      - 'tests/tv-multi-appareils-browser.cjs'
      - 'package*.json'
      - '.github/workflows/v2-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    name: Types et tests TV
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branche V2
        uses: actions/checkout@v4
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier le typage
        run: npx tsc --noEmit
      - name: Vérifier l'écran TV
        run: npm run test:tv
      - name: Vérifier les scénarios d'imprévus
        run: npm run test:imprevus
      - name: Vérifier les retours de connexion sécurisés
        run: node tests/pronostics.cjs
      - name: Compiler la V2 hors publication
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kmjfmjhdnokkaiolxiin.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-non-production-key-not-connected
          NEXT_PUBLIC_TOURNEO_V2_PRODUCTION_APPROVED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Installer Chromium pour le parcours TV simulé
        run: npx playwright install chromium
      - name: Tester la télécommande et la TV dans deux navigateurs isolés
        run: node tests/tv-multi-appareils-browser.cjs
      - name: Tester les scénarios d'imprévus en navigateur mobile
        env:
          TEST_WIDTHS: '390'
        run: node tests/experience-browser.cjs
